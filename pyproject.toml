[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchpasskey"
version = "0.1.0"
description = "Local MIDI-derived password generator with Clean Architecture."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.11.2,<7",
    "mido>=1.3.3,<2",
    "python-rtmidi>=1.5.8,<2",
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
pitchpasskey = "pitchpasskey.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pitchpasskey"]
